<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>羽田タクシーカメラ</title>
<style>
:root {
  color-scheme: light dark;
  --tile-min: 160px;
  --bg: #eef1f4;
  --surface: #ffffff;
  --bar-bg: #ffffff;
  --text: #1a2230;
  --muted: #566274;
  --border: #d3d9e0;
  --accent: #0a58b0;
  --img-bg: #dfe4ea;
  --fail: #b3261e;
  --fail-bg: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0d11;
    --surface: #141920;
    --bar-bg: #10151b;
    --text: #d6dbe2;
    --muted: #8a94a3;
    --border: #262e39;
    --accent: #7db6f7;
    --img-bg: #0c0f13;
    --fail: #ff9a90;
    --fail-bg: #3b1d1b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 12px;
  padding: 4px 12px;
  background: var(--bar-bg);
  border-bottom: 1px solid var(--border);
}
.stamp {
  margin-left: auto;
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#refresh {
  min-height: 34px;
  padding: 0 12px;
  font: inherit;
  font-size: 13px;
  color: var(--accent);
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 6px;
  cursor: pointer;
}

main { max-width: 1680px; margin: 0 auto; padding: 0 12px 8px; }
h2 { margin: 22px 0 8px; font-size: 18px; }
h2 small { font-size: 14px; font-weight: 400; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr)); gap: 6px; }

.card {
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.card.failed { border-color: var(--fail); }
.head { padding: 5px 5px 4px; }
.head h4 { margin: 0; font-size: 11px; line-height: 1.3; }
.head p { margin: 0; font-size: 10px; line-height: 1.3; color: var(--muted); }
.shot { position: relative; display: block; width: 100%; background: var(--img-bg); }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 1px 4px;
  padding: 4px 5px 5px;
  font-size: 10px;
  line-height: 1.3;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.fail { padding: 0 3px; font-weight: 700; color: var(--fail); background: var(--fail-bg); border-radius: 4px; }

footer {
  max-width: 1680px;
  margin: 16px auto 0;
  padding: 14px 12px 28px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--muted);
}
footer p { margin: 0 0 8px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; padding: 0; list-style: none; }
.warn { font-size: 14px; font-weight: 700; color: var(--text); }
</style>
</head>
<body>
<header class="bar">
  <span class="stamp" id="stamp">最終更新 --:--:--</span>
  <button type="button" id="refresh">今すぐ更新</button>
</header>

<main id="app"></main>

<footer>
  <p>出典: 東京タクシーセンター 羽田空港TPシステム
    （<a href="https://www.tokyo-tc.or.jp/driver/stand/livecamera/" target="_blank" rel="noopener noreferrer">ライブカメラ案内</a>）</p>
  <p>公式の各ページ:</p>
  <ul class="links">
    <li><a href="https://ttc.taxi-inf.jp/index.php" target="_blank" rel="noopener noreferrer">第1待機所</a></li>
    <li><a href="https://ttc.taxi-inf.jp/no23.php" target="_blank" rel="noopener noreferrer">第3・4待機所</a></li>
    <li><a href="https://ttc.taxi-inf.jp/hnd1.php" target="_blank" rel="noopener noreferrer">T1 乗り場</a></li>
    <li><a href="https://ttc.taxi-inf.jp/hnd2.php" target="_blank" rel="noopener noreferrer">T2 乗り場</a></li>
    <li><a href="https://ttc.taxi-inf.jp/No4TaxiStand.php" target="_blank" rel="noopener noreferrer">第4乗り場</a></li>
    <li><a href="https://ttc.taxi-inf.jp/No5TaxiStand.php" target="_blank" rel="noopener noreferrer">第5乗り場</a></li>
  </ul>
  <p class="warn">運転中は見ない。停車して確認</p>
</footer>

<script>
'use strict';

const BASE = 'https://ttc.taxi-inf.jp/';
const INTERVAL_MS = 30000;

const GROUPS = [
  { id: 'domestic', name: '国内線', area: 'T1・T2' },
  { id: 'intl', name: '国際線', area: 'T3' },
];

// g=グループ, f=ファイル名, w/h=実寸, t=見出し, n=補足 (配列順 = 表示順)
const CAMS = [
  { g: 'domestic', f: 'Real119_line.jpg', w: 1024, h: 574, t: '第1乗り場', n: 'T1' },
  { g: 'domestic', f: 'Real121_line.jpg', w: 1024, h: 574, t: '第2乗り場', n: 'T1' },
  { g: 'domestic', f: 'Real123_line.jpg', w: 1024, h: 574, t: '第3乗り場', n: 'T2' },
  { g: 'domestic', f: 'Real104_line.jpg', w: 1024, h: 574, t: '第4乗り場', n: 'T2 (国際線の客もここに出る)' },
  { g: 'domestic', f: 'Real105_line.jpg', w: 1024, h: 768, t: '第4乗り場 接写', n: 'T2' },
  { g: 'domestic', f: 'Real002.jpg', w: 768, h: 384, t: '第1待機所 東側', n: '4号乗り場行き' },
  { g: 'domestic', f: 'Real001.jpg', w: 768, h: 384, t: '第1待機所 南側', n: '1〜3号乗り場行き' },
  { g: 'intl', f: 'Real106.jpg', w: 1024, h: 574, t: '第5乗り場 カメラ1', n: 'T3' },
  { g: 'intl', f: 'Real107.jpg', w: 1024, h: 768, t: '第5乗り場 カメラ2', n: 'T3' },
  { g: 'intl', f: 'Real108.jpg', w: 1024, h: 574, t: '第3待機所 前方', n: '' },
  { g: 'intl', f: 'Real109.jpg', w: 1024, h: 574, t: '第3待機所 中間', n: '' },
  { g: 'intl', f: 'Real03.jpg', w: 1024, h: 573, t: '第3待機所 後方', n: '' },
  { g: 'intl', f: 'Real04.jpg', w: 800, h: 600, t: '第4待機所', n: '' },
];

const views = [];
const stamp = document.getElementById('stamp');
let timer = null;

const pad = n => String(n).padStart(2, '0');
const hms = d => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function buildCard(c) {
  const card = el('article', 'card');
  const head = el('div', 'head');
  head.append(el('h4', null, c.t));
  if (c.n) head.append(el('p', null, c.n));
  const link = el('a', 'shot');
  link.href = BASE + c.f;
  link.target = '_blank';
  link.rel = 'noopener';
  link.style.aspectRatio = c.w + ' / ' + c.h;
  link.setAttribute('aria-label', c.t + ' の画像を原寸で開く (新しいタブ)');
  const img = el('img');
  img.alt = c.t;
  link.append(img);
  const foot = el('div', 'foot');
  const time = el('span', null, '読込 --:--:--');
  const fail = el('span', 'fail', '取得失敗');
  fail.hidden = true;
  foot.append(time, fail);
  card.append(head, link, foot);
  views.push({ url: BASE + c.f, card, img, time, fail });
  return card;
}

function buildPage(root) {
  GROUPS.forEach(g => {
    const sec = el('section');
    sec.id = g.id;
    const h2 = el('h2', null, g.name);
    h2.append(el('small', null, '（' + g.area + '）'));
    sec.append(h2);
    const grid = el('div', 'grid');
    CAMS.filter(c => c.g === g.id).forEach(c => grid.append(buildCard(c)));
    sec.append(grid);
    root.append(sec);
  });
}

function onLoaded(v, src) {
  const now = hms(new Date());
  v.img.src = src;
  v.time.textContent = '読込 ' + now;
  v.fail.hidden = true;
  v.card.classList.remove('failed');
  stamp.textContent = '最終更新 ' + now;
}

function onFailed(v) {
  v.fail.hidden = false;
  v.card.classList.add('failed');
}

function loadView(v) {
  const pre = new Image();
  pre.onload = () => onLoaded(v, pre.src);
  pre.onerror = () => onFailed(v);
  pre.src = v.url + '?t=' + Date.now();
}

function refreshNow() {
  views.forEach(loadView);
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) views.forEach(loadView); }, INTERVAL_MS);
}

buildPage(document.getElementById('app'));
document.getElementById('refresh').addEventListener('click', refreshNow);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshNow(); });
refreshNow();
</script>
</body>
</html>
